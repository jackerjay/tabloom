<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="用本地 AI agent 把当前窗口的标签按任务分组，预览后应用，可撤销、去重。">
  <title>织页 TabLoom</title>
  <link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600&family=IBM+Plex+Sans:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="theme-boot.js"></script>
</head>
<body class="popup">
  <header class="app-header rise" style="--i:0">
    <div class="brand">
      <span class="logo"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <rect x="4" y="4" width="12" height="9" rx="2.5" stroke="currentColor" stroke-opacity=".55" stroke-width="1.6"/>
        <path d="M3 10.5A2.5 2.5 0 0 1 5.5 8h4.2c.8 0 1.5.4 1.9 1l.5.8H17a2.5 2.5 0 0 1 2.5 2.5v5.2A2.5 2.5 0 0 1 17 20H5.5A2.5 2.5 0 0 1 3 17.5v-7Z" fill="currentColor"/>
        <path d="M19.5 3c.2 1.8.8 2.4 2.5 2.6-1.7.2-2.3.8-2.5 2.6-.2-1.8-.8-2.4-2.5-2.6 1.7-.2 2.3-.8 2.5-2.6Z" fill="#FFD479"/>
      </svg></span>
      <div class="brand-text">
        <h1>织页 TabLoom</h1>
        <span class="brand-sub">本地 AI 标签织理</span>
      </div>
    </div>
    <span id="health" class="pill"><span class="pulse"></span>检测中…</span>
  </header>

  <main>
    <button id="organize" class="primary hero rise" style="--i:1">
      <span class="hero-icon"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 4V2"/><path d="M15 16v-2"/><path d="M8 9h2"/><path d="M20 9h2"/><path d="M17.8 11.8 19 13"/><path d="M15 9h.01"/><path d="M17.8 6.2 19 5"/><path d="m3 21 9-9"/><path d="M12.2 6.2 11 5"/></svg></span>
      <span class="hero-text">整理当前窗口<small>AI 语义分组，预览后应用</small></span>
    </button>

    <div class="row quick-row rise" style="--i:1">
      <button id="dedup" class="ghost grow" title="关闭重复标签，保留活跃/最左一个"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#FBBF24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="vertical-align:-2px;margin-right:5px"><rect x="8" y="8" width="14" height="14" rx="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/><path d="m12 12 6 6"/><path d="m18 12-6 6"/></svg>一键去重 <span id="dupCount" class="badge zero">0</span></button>
      <button id="dedupUndo" class="ghost hidden" title="恢复上次去重关闭的标签"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-15-6.7L3 13"/></svg>恢复</button>
    </div>

    <div id="error" class="banner hidden"></div>

    <section id="preview" class="card hidden">
      <div class="card-head">
        <span class="card-title">分组预览</span>
        <span id="preview-meta" class="meta"></span>
      </div>
      <ul id="groups" class="group-list"></ul>
      <div class="row">
        <button id="apply" class="primary">应用分组</button>
        <button id="regen" class="ghost"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>重新生成</button>
      </div>
    </section>

    <section id="done" class="card hidden">
      <p id="done-text" class="done-text"></p>
      <div class="row">
        <button id="undo" class="ghost">撤销</button>
        <button id="again" class="ghost">再整理一次</button>
      </div>
    </section>

    <section class="card rise" style="--i:2">
      <div class="card-head">
        <span class="card-title">模型</span>
        <button id="refreshModels" class="icon-btn" title="刷新模型列表" aria-label="刷新模型列表"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg></button>
      </div>
      <select id="model" class="select"></select>
      <div id="model-meta" class="meta mono"></div>
    </section>
  </main>

  <footer class="app-footer rise" style="--i:3">
    <label class="setting">
      <span>服务地址</span>
      <input id="serviceUrl" type="text" spellcheck="false" placeholder="http://127.0.0.1:8787">
    </label>
    <div class="setting">
      <span>自动整理新标签（30s 防抖）</span>
      <label class="switch"><input id="autoOrganize" type="checkbox"><span class="track"></span></label>
    </div>
    <div class="setting">
      <span>外观主题</span>
      <div class="theme-seg" data-theme-seg role="radiogroup" aria-label="外观主题"></div>
    </div>
    <div class="setting">
      <span>界面语言</span>
      <div class="theme-seg lang-seg" data-lang-seg role="radiogroup" aria-label="界面语言"></div>
    </div>
    <button id="openHome" class="link">打开首页工作台<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg></button>
    <button id="sidepanel" class="link">打开 AI 侧边栏<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg></button>
  </footer>

  <div id="toast"></div>
  <script src="i18n.js"></script>
  <script src="api.js"></script>
  <script src="ui.js"></script>
  <script src="palette.js"></script>
  <script src="popup.js"></script>
</body>
</html>
